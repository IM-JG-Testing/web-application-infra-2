name: Send Terraform state to Azure

on:
  workflow_dispatch:

# Allows GitHub to request the token that Azure needs
permissions:
  id-token: write
  contents: read

jobs:
  send-tfstate-to-az:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
      
      - name: Initialize Terraform
        id: terraform-init
        run: |
          terraform init

      - name: Generate Terraform plan
        id: terraform-plan
        run: |
          terraform plan -out=tfplan
          echo "tfplan_file=tfplan" >> "$GITHUB_OUTPUT"

      - name: Publish Terraform plan to step summary
        if: always()
        run: |
          terraform show -no-color ${{ steps.terraform-plan.outputs.tfplan_file }} >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Terraform plan 
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.terraform-plan.outputs.tfplan_file }}
          archive: false

      - name: Apply Terraform plan
        id: terraform-apply
        run: |
          terraform apply -auto-approve ${{ steps.terraform-plan.outputs.tfplan_file }}
